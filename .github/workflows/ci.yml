name: Java CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Build and tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify build and run tests
        run: mvn -B -ntp verify
