spring:
  application:
    name: orderflow-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/orderflow}
    username: ${DB_USER:orderflow}
    password: ${DB_PASSWORD:orderflow_dev_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: 8080
